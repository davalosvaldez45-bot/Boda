<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datos bancarios — Fabiola & Gustavo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF8F0;
    --olive:#63711F;
    --olive-deep:#3C4713;
    --olive-pale:#E7E9CE;
    --gold:#B08D57;
    --gold-soft:#DCCBA3;
    --ink:#3B3A32;
    --ink-soft:#6f6e62;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    font-family:'Jost', sans-serif;
    background:var(--cream);
    color:var(--ink);
    display:flex; align-items:center;
    padding:3.2vw 5vw;
    overflow:hidden;
  }
  .wrap{ max-width:420px; margin:0 auto; width:100%; }
  header{ text-align:center; margin-bottom:.9rem; }
  header .eyebrow{
    font-size:.6rem; letter-spacing:.28em; text-transform:uppercase; color:var(--gold);
  }
  header h1{
    font-family:'Parisienne', cursive; font-weight:400;
    font-size:clamp(1.5rem,6.5vw,1.9rem); color:var(--olive-deep);
    margin-top:.15rem; line-height:1;
  }

  .cards{ display:flex; flex-direction:column; gap:.6rem; }
  .card{
    background:var(--olive-pale);
    border:1px solid var(--gold-soft);
    padding:.8rem .9rem;
  }
  .card h2{
    font-family:'Playfair Display', serif; font-style:italic; font-weight:600;
    color:var(--olive-deep); font-size:.85rem; margin-bottom:.4rem;
    text-align:center;
  }
  .row{
    display:flex; justify-content:space-between; gap:.6rem;
    padding:.28rem 0; border-bottom:1px dashed var(--gold-soft);
    font-size:.72rem; line-height:1.2;
  }
  .row:last-child{ border-bottom:none; }
  .row .k{ color:var(--ink-soft); white-space:nowrap; }
  .row .v{ color:var(--olive-deep); font-weight:500; text-align:right; }

  footer{ text-align:center; margin-top:.7rem; }
  footer .script{ font-family:'Parisienne', cursive; font-size:.95rem; color:var(--gold); }

  /* ======================================================
     EDITAR AQUÍ ABAJO tus datos reales — cambiá el texto
     que está entre las etiquetas <span class="v">...</span>
     ====================================================== */
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">Sugerencia de regalo</p><br>
    <h1>Fabiola &amp; Gustavo</h1></p><br>
    <p class="section-sub reveal">Si desean hacernos un regalo, pueden hacerlo mediante transferencia bancaria</p>
  </header>

  <div class="cards">
    <!-- ============ DATOS DEL NOVIO ============ -->
    <div class="card">

      <div class="row"><span class="k">Alias Nro. Celular</span><span class="v">0982308277</span></div>
      <div class="row"><span class="k">Banco</span><span class="v">UENO</span></div>
      <div class="row"><span class="k">Cuenta</span><span class="v">3643613</span></div>
      <div class="row"><span class="k">CI</span><span class="v">4769137</span></div>
      <div class="row"><span class="k">Nombre</span><span class="v">Gustavo Maldonado</span></div>
    </div>

  <footer>
    <p class="script">¡Gracias por acompañarnos!</p>
  </footer>
</div>

</body>
</html>
